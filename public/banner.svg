<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" height="100%">
  <defs>
    <!-- Background Dark Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08080C" />
      <stop offset="50%" stop-color="#121016" />
      <stop offset="100%" stop-color="#1A0A0A" />
    </linearGradient>

    <!-- Animated Red to Orange Title Gradient -->
    <linearGradient id="titleGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF2E3B">
        <animate attributeName="stop-color" values="#FF2E3B;#FF6600;#FF0055;#FF2E3B" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#FF6600">
        <animate attributeName="stop-color" values="#FF6600;#FF9900;#FF2E3B;#FF6600" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#FF9900">
        <animate attributeName="stop-color" values="#FF9900;#FF2E3B;#FF6600;#FF9900" dur="6s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Animated Scanning Laser Line -->
    <linearGradient id="lineGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF2E3B" stop-opacity="0" />
      <stop offset="30%" stop-color="#FF2E3B" stop-opacity="1" />
      <stop offset="50%" stop-color="#FFAA00" stop-opacity="1" />
      <stop offset="70%" stop-color="#FF2E3B" stop-opacity="1" />
      <stop offset="100%" stop-color="#FF8800" stop-opacity="0" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <filter id="laserGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes pulseAura {
      0% { opacity: 0.12; transform: scale(0.95); }
      50% { opacity: 0.28; transform: scale(1.08); }
      100% { opacity: 0.12; transform: scale(0.95); }
    }
    @keyframes scanLine {
      0% { stroke-dashoffset: 1000; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes floatText {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-3px); }
      100% { transform: translateY(0px); }
    }
    .aura-bg {
      transform-origin: 600px 120px;
      animation: pulseAura 4s ease-in-out indefinite;
    }
    .float-title {
      animation: floatText 3s ease-in-out indefinite;
    }
    .scan-path {
      stroke-dasharray: 400 600;
      animation: scanLine 3s linear indefinite;
    }
  </style>

  <!-- Canvas Background -->
  <rect width="1200" height="300" rx="16" fill="url(#bgGradient)" />
  <rect width="1198" height="298" x="1" y="1" rx="15" fill="none" stroke="#FF3300" stroke-opacity="0.35" stroke-width="1.5" />

  <!-- Animated Glowing Aura -->
  <circle class="aura-bg" cx="600" cy="120" r="190" fill="#FF3300" filter="url(#glow)" />

  <!-- Lightning Symbol & Title Group -->
  <g class="float-title" transform="translate(600, 125)" text-anchor="middle">
    <!-- Main Title -->
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="64" letter-spacing="4" fill="url(#titleGradient)" filter="url(#glow)">
      ⚡ ORIGIN STUDIO
    </text>

    <!-- Subtitle -->
    <text y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="20" letter-spacing="2" fill="#F1F5F9" opacity="0.95">
      Production-Grade YouTube &amp; TikTok High-Performance Downloader
    </text>
  </g>

  <!-- Animated Laser Divider Line -->
  <path class="scan-path" d="M 150 200 L 1050 200" stroke="url(#lineGradient)" stroke-width="3" stroke-linecap="round" filter="url(#laserGlow)" />

  <!-- Feature Pills Footer -->
  <g transform="translate(600, 245)" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700">
    <text fill="#FF5500">AV1 / VP9 / H.264 Codec Selector</text>
    <text x="-250" fill="#64748B">•</text>
    <text x="-230" fill="#E2E8F0">0% Loss Audio Copy</text>
    <text x="230" fill="#64748B">•</text>
    <text x="250" fill="#E2E8F0">ffprobe Data Verification</text>
  </g>
</svg>
