  <text x="32" y="38" font-family="-apple-system, sans-serif" font-size="18" font-weight="800" fill="#FFFFFF">📁 Repository Directory Structure</text>
  <rect x="32" y="52" width="1136" height="165" rx="8" fill="#0A0810" stroke="#FF4500" stroke-opacity="0.3" />
  
  <g transform="translate(50, 78)" font-family="'Fira Code', monospace" font-size="13" font-weight="600">
    <text y="0" fill="#FF5500">Orgirin/</text>
    <text y="22" fill="#CBD5E1">├── 📂 core/             <tspan fill="#64748B"># Python backend (yt-dlp, downloader seam, task_queue)</tspan></text>
