      <stop offset="0%" stop-color="#14111E" />
      <stop offset="100%" stop-color="#0B0912" />
    </linearGradient>
    <linearGradient id="cBorder4" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF2E3B" />
      <stop offset="50%" stop-color="#FF6600" />
      <stop offset="100%" stop-color="#FF9900" />
    </linearGradient>
    <filter id="cGlow4" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="6" result="blur" />
