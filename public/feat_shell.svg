  <text x="58" y="83" font-family="-apple-system, sans-serif" font-size="15" font-weight="700" fill="#FF6600">PySide6 Native Shell: <tspan font-size="14" font-weight="500" fill="#CBD5E1">High-speed asynchronous QWebChannel bridge connecting React 19 UI with Python core.</tspan></text>

  <circle cx="42" cy="110" r="5" fill="#FF6600" />
  <text x="58" y="115" font-family="-apple-system, sans-serif" font-size="15" font-weight="700" fill="#FF6600">Trim Range Engine: <tspan font-size="14" font-weight="500" fill="#CBD5E1">Cut precise video segments by seconds directly prior to downloading, saving 90% space.</tspan></text>

  <circle cx="42" cy="142" r="5" fill="#FF9900" />
  <text x="58" y="147" font-family="-apple-system, sans-serif" font-size="15" font-weight="700" fill="#FF6600">Multi-Threaded Queue: <tspan font-size="14" font-weight="500" fill="#CBD5E1">Parallel download queue manager with live speedmeter, ETA &amp; instant cancel seams.</tspan></text>
