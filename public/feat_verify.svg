<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 160" width="100%" height="100%">
  <defs>
    <linearGradient id="cBg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14111E" />
      <stop offset="100%" stop-color="#0B0912" />
    </linearGradient>
    <linearGradient id="cBorder3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF2E3B" />
      <stop offset="50%" stop-color="#FF6600" />
      <stop offset="100%" stop-color="#FF9900" />
    </linearGradient>
    <filter id="cGlow3" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="1200" height="160" rx="16" fill="url(#cBg3)" stroke="url(#cBorder3)" stroke-width="1.5" filter="url(#cGlow3)" />
  <text x="32" y="42" font-family="-apple-system, sans-serif" font-size="22" font-weight="900" fill="#FFFFFF">🛡️ Real-Time ffprobe Verification Engine</text>
  
  <circle cx="42" cy="78" r="5" fill="#FF2E3B" />
  <text x="58" y="83" font-family="-apple-system, sans-serif" font-size="15" font-weight="700" fill="#FF6600">Stream Integrity Audit: <tspan font-size="14" font-weight="500" fill="#CBD5E1">Runs ffprobe post-download to verify video width, height, resolution &amp; audio streams.</tspan></text>

  <circle cx="42" cy="110" r="5" fill="#FF6600" />
  <text x="58" y="115" font-family="-apple-system, sans-serif" font-size="15" font-weight="700" fill="#FF6600">Header Magic-Bytes Audit: <tspan font-size="14" font-weight="500" fill="#CBD5E1">Inspects image headers (JPEG/PNG/WEBP) to eliminate corrupt files or CDN error pages.</tspan></text>

  <circle cx="42" cy="142" r="5" fill="#FF9900" />
  <text x="58" y="147" font-family="-apple-system, sans-serif" font-size="15" font-weight="700" fill="#FF6600">Strict Exception Seam: <tspan font-size="14" font-weight="500" fill="#CBD5E1">Raises VerificationMismatchError on corruption instead of reporting false success.</tspan></text>
</svg>
