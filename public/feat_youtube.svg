<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 160" width="100%" height="100%">
  <defs>
    <linearGradient id="cBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14111E" />
      <stop offset="100%" stop-color="#0B0912" />
    </linearGradient>
    <linearGradient id="cBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF2E3B" />
      <stop offset="50%" stop-color="#FF6600" />
      <stop offset="100%" stop-color="#FF9900" />
    </linearGradient>
    <filter id="cGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="1200" height="160" rx="16" fill="url(#cBg)" stroke="url(#cBorder)" stroke-width="1.5" filter="url(#cGlow)" />
  <text x="32" y="42" font-family="-apple-system, sans-serif" font-size="22" font-weight="900" fill="#FFFFFF">🎬 YouTube Dual-Engine Pipeline</text>
  
  <circle cx="42" cy="78" r="5" fill="#FF2E3B" />
  <text x="58" y="83" font-family="-apple-system, sans-serif" font-size="15" font-weight="700" fill="#FF6600">Best Quality (MKV AV1/VP9): <tspan font-size="14" font-weight="500" fill="#CBD5E1">Prioritizes modern codecs for max sharpness, saving 50-60% storage space vs H.264.</tspan></text>

  <circle cx="42" cy="110" r="5" fill="#FF6600" />
  <text x="58" y="115" font-family="-apple-system, sans-serif" font-size="15" font-weight="700" fill="#FF6600">Compatible MP4 (H.264/AAC): <tspan font-size="14" font-weight="500" fill="#CBD5E1">Ensures 100% playback compatibility on legacy TVs, projectors &amp; video editors.</tspan></text>

  <circle cx="42" cy="142" r="5" fill="#FF9900" />
  <text x="58" y="147" font-family="-apple-system, sans-serif" font-size="15" font-weight="700" fill="#FF6600">Dynamic Size Predictions: <tspan font-size="14" font-weight="500" fill="#CBD5E1">Real-time format size predictions accurate to ~99% before downloading.</tspan></text>
</svg>
