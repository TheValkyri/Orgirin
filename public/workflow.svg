<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 780" width="100%" height="100%">
  <defs>
    <!-- Background Dark Gradient -->
    <linearGradient id="wfBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#08080C" />
      <stop offset="50%" stop-color="#0F0E14" />
      <stop offset="100%" stop-color="#140909" />
    </linearGradient>

    <!-- Glowing Card Border Gradients -->
    <linearGradient id="cardRedOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF2E3B" />
      <stop offset="100%" stop-color="#FF6600" />
    </linearGradient>

    <linearGradient id="cardGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <linearGradient id="cardRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444" />
      <stop offset="100%" stop-color="#991B1B" />
    </linearGradient>

    <!-- Animated Path Line Gradient -->
    <linearGradient id="flowGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF2E3B" />
      <stop offset="50%" stop-color="#FF6600" />
      <stop offset="100%" stop-color="#FFAA00" />
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="boxGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes flowDash {
      0% { stroke-dashoffset: 40; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes pulseGlow {
      0% { opacity: 0.6; }
      50% { opacity: 1.0; filter: drop-shadow(0 0 8px rgba(255, 68, 0, 0.8)); }
      100% { opacity: 0.6; }
    }
    .flow-line {
      stroke-dasharray: 8 8;
      animation: flowDash 1.2s linear indefinite;
    }
    .card-pulse {
      animation: pulseGlow 3s ease-in-out indefinite;
    }
  </style>

  <!-- Background Canvas -->
  <rect width="1000" height="780" rx="16" fill="url(#wfBg)" />
  <rect width="998" height="778" x="1" y="1" rx="15" fill="none" stroke="#FF3300" stroke-opacity="0.25" stroke-width="1.5" />

  <!-- Background Section Container (Extraction Engines Subgraph) -->
  <rect x="120" y="240" width="760" height="210" rx="16" fill="#14121A" fill-opacity="0.8" stroke="#FF5500" stroke-opacity="0.3" stroke-width="1.5" stroke-dasharray="6 6" />
  <text x="500" y="268" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="14" font-weight="700" fill="#FF7700" letter-spacing="1.5">
    ⚡ EXTRACTION ENGINES &amp; DOMAIN ROUTER
  </text>

  <!-- Animated Connection Paths (Arrows) -->
  <!-- 1. UI -> Shell -->
  <path class="flow-line" d="M 500 80 L 500 130" stroke="url(#flowGradient)" stroke-width="2.5" fill="none" />
  <!-- 2. Shell -> Router -->
  <path class="flow-line" d="M 500 190 L 500 290" stroke="url(#flowGradient)" stroke-width="2.5" fill="none" />
  <!-- 3. Router -> YouTube Pipeline -->
  <path class="flow-line" d="M 380 320 L 290 360" stroke="url(#flowGradient)" stroke-width="2.5" fill="none" />
  <!-- 4. Router -> TikTok Extractor -->
  <path class="flow-line" d="M 620 320 L 710 360" stroke="url(#flowGradient)" stroke-width="2.5" fill="none" />
  <!-- 5. YouTube -> Task Queue -->
  <path class="flow-line" d="M 290 420 L 390 480" stroke="url(#flowGradient)" stroke-width="2.5" fill="none" />
  <!-- 6. TikTok -> Task Queue -->
  <path class="flow-line" d="M 710 420 L 610 480" stroke="url(#flowGradient)" stroke-width="2.5" fill="none" />
  <!-- 7. Task Queue -> Verification -->
  <path class="flow-line" d="M 500 540 L 500 590" stroke="url(#flowGradient)" stroke-width="2.5" fill="none" />
  <!-- 8. Verification -> Pass -->
  <path class="flow-line" d="M 390 630 L 320 680" stroke="#10B981" stroke-width="2.5" stroke-dasharray="8 8" fill="none" />
  <!-- 9. Verification -> Fail -->
  <path class="flow-line" d="M 610 630 L 680 680" stroke="#EF4444" stroke-width="2.5" stroke-dasharray="8 8" fill="none" />

  <!-- Node 1: React 19 UI -->
  <g transform="translate(320, 25)">
    <rect width="360" height="55" rx="12" fill="#181824" stroke="url(#cardRedOrange)" stroke-width="2" filter="url(#neonGlow)" />
    <text x="180" y="34" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">
      💻 React 19 Glassmorphic Dashboard
    </text>
  </g>

  <!-- Node 2: PySide6 App Shell -->
  <g transform="translate(320, 135)">
    <rect width="360" height="55" rx="12" fill="#1A1520" stroke="url(#cardRedOrange)" stroke-width="2" filter="url(#neonGlow)" />
    <text x="180" y="34" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">
      ⚙️ PySide6 Desktop Shell (QWebChannel)
    </text>
  </g>

  <!-- Node 3: Platform Router -->
  <g transform="translate(350, 290)">
    <rect width="300" height="50" rx="10" fill="#241416" stroke="#FF5500" stroke-width="2" />
    <text x="150" y="31" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="15" font-weight="700" fill="#FFBB88">
      🔀 Domain Platform Router
    </text>
  </g>

  <!-- Node 4A: YouTube Pipeline -->
  <g transform="translate(150, 360)">
    <rect width="280" height="55" rx="10" fill="#1C1824" stroke="#FF2E3B" stroke-width="1.5" />
    <text x="140" y="34" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="15" font-weight="700" fill="#E2E8F0">
      📺 YouTube Engine (yt-dlp)
    </text>
  </g>

  <!-- Node 4B: TikTok Extractor -->
  <g transform="translate(570, 360)">
    <rect width="280" height="55" rx="10" fill="#1C1824" stroke="#FF6600" stroke-width="1.5" />
    <text x="140" y="34" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="15" font-weight="700" fill="#E2E8F0">
      🎵 TikTok Extractor (Orchestrator)
    </text>
  </g>

  <!-- Node 5: Task Queue -->
  <g transform="translate(320, 480)">
    <rect width="360" height="55" rx="12" fill="#1A1828" stroke="url(#cardRedOrange)" stroke-width="2" />
    <text x="180" y="34" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">
      📥 Multi-Threaded Task Queue
    </text>
  </g>

  <!-- Node 6: Verification -->
  <g transform="translate(320, 585)">
    <rect width="360" height="55" rx="12" fill="#26161A" stroke="#FF4500" stroke-width="2" filter="url(#neonGlow)" />
    <text x="180" y="34" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="15" font-weight="700" fill="#FFAA88">
      🔍 ffprobe &amp; Header Magic-Bytes Verification
    </text>
  </g>

  <!-- Node 7A: Output Pass -->
  <g transform="translate(150, 680)">
    <rect width="320" height="55" rx="12" fill="#0A2218" stroke="url(#cardGreen)" stroke-width="2" />
    <text x="160" y="34" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="15" font-weight="700" fill="#34D399">
      ✅ Verified File Output (0-Loss)
    </text>
  </g>

  <!-- Node 7B: Output Fail -->
  <g transform="translate(530, 680)">
    <rect width="320" height="55" rx="12" fill="#280C0E" stroke="url(#cardRed)" stroke-width="2" />
    <text x="160" y="34" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="15" font-weight="700" fill="#F87171">
      ❌ VerificationMismatchError (Auto-Clean)
    </text>
  </g>
</svg>
